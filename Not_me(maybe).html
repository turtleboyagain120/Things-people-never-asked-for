<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 100 Facts Reality Matrix & API Audio Stage</title>
    <style>
        :root {
            --bg-dark: #05070f;
            --card-bg: #0b1120;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --accent-rose: #f43f5e;
            --text-light: #f8fafc;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #3b82f6, #10b981, #f59e0b, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        /* --- THE STAGE & BLOB RICKROLL ANIMATION --- */
        .animation-arena {
            background: #02040a;
            border: 2px solid #1e293b;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2.5rem;
            max-width: 600px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stage {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* The Blob Actor */
        .blob {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            transform-origin: bottom center;
            transition: all 0.3s ease;
        }

        /* Microphone Asset */
        .mic {
            position: absolute;
            bottom: -10px;
            right: -15px;
            width: 12px;
            height: 30px;
            background: #94a3b8;
            border-radius: 4px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }
        .mic::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -4px;
            width: 20px;
            height: 20px;
            background: #cbd5e1;
            border-radius: 50%;
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.5);
        }

        /* Wig Asset */
        .wig {
            position: absolute;
            top: -22px;
            width: 100px;
            height: 40px;
            background: #b45309; /* Ginger/Orange-brown hair */
            border-radius: 40px 40px 10px 10px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            box-shadow: inset 0 4px 10px rgba(255,255,255,0.2);
        }

        .face {
            display: flex;
            gap: 16px;
            transition: transform 0.2s;
        }

        .eye {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            position: relative;
        }
        .eye::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            right: 1px;
            top: 2px;
        }

        /* --- ACTIVE RICKROLL STATE TRIGGERS --- */
        .animation-arena.rickrolled .blob {
            background: linear-gradient(135deg, #ea580c 0%, #ca8a04 100%); /* Ginger palette match */
            animation: rick-dance 0.6s infinite alternate cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 15px 35px rgba(234, 88, 12, 0.5);
        }

        .animation-arena.rickrolled .mic {
            opacity: 1;
            transform: scale(1) rotate(-10deg);
        }

        .animation-arena.rickrolled .wig {
            opacity: 1;
            transform: translateY(0);
        }

        .animation-arena.rickrolled .eye {
            animation: blink 1.2s infinite;
        }

        /* Hardware-Accelerated Dance Choreography */
        @keyframes rick-dance {
            0% { transform: scale(1.1, 0.85) translateX(-20px) rotate(-5deg); }
            50% { transform: scale(0.95, 1.05) translateY(-15px) translateX(0) rotate(5deg); }
            100% { transform: scale(1.1, 0.85) translateX(20px) rotate(-5deg); }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .lyric-box {
            font-family: monospace;
            font-weight: 700;
            color: var(--accent-amber);
            height: 24px;
            margin-top: 1rem;
            font-size: 1.1rem;
        }

        /* --- FACTS GRID ARCHITECTURE --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-bottom: 3rem;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 1.25rem;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .panel:hover {
            border-color: #334155;
        }

        /* Category borders */
        .cat-hist { border-left: 3px solid var(--accent-blue); }
        .cat-zoo { border-left: 3px solid var(--accent-green); }
        .cat-bio { border-left: 3px solid var(--accent-amber); }
        .cat-space { border-left: 3px solid var(--accent-purple); }

        .fact-num {
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .cat-hist .fact-num { color: var(--accent-blue); }
        .cat-zoo .fact-num { color: var(--accent-green); }
        .cat-bio .fact-num { color: var(--accent-amber); }
        .cat-space .fact-num { color: var(--accent-purple); }

        p {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 1.25rem;
        }

        .btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, color 0.2s;
        }

        .btn:hover {
            background: var(--accent-rose);
            color: white;
            border-color: var(--accent-rose);
        }

        .console-box {
            background: #02040a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 1.25rem;
            font-family: monospace;
            font-size: 0.85rem;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            color: #a7f3d0;
            width: 100%;
        }

        .console-line {
            margin-bottom: 0.25rem;
            border-left: 2px solid var(--accent-rose);
            padding-left: 0.5rem;
        }
    </style>
</head>

        function appendLog(message) {
            const consoleBox = document.getElementById('consoleBox');
            const element = document.createElement('div');
            element.className = 'console-line';
            element.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;

        }

        function triggerDownloadPipeline(fileName, stringBody) {
            const dataBlob = new Blob([stringBody], { type: 'text/plain' });
            const directUrl = URL.createObjectURL(dataBlob);
            const anchor = document.createElement('a');
            anchor.href = directUrl;
            anchor.download = fileName;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(directUrl);
            appendLog(`💾 Payload dumped: ${fileName}`);
        }

        // --- CORE PURE FETCH AND AUDIO PIPELINE ENGINE ---
        async function initializeAudioStream() {
            if (audioContext) return; // Already setup and running

            appendLog(`🌐 Dispatching async fetch to global endpoint: ${AUDIO_TARGET_ENDPOINT}`);
            try {
                const response = await fetch(AUDIO_TARGET_ENDPOINT);
                if (!response.ok) throw new Error(`HTTP network response code: ${response.status}`);
                
                appendLog("📥 Direct audio binary buffer received successfully. Converting array map...");
                const rawBuffer = await response.arrayBuffer();
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);

                audioContext.decodeAudioData(rawBuffer, (decoded) => {
                    appendLog("🎉 Audio decoding array success! Initializing audio timeline source loops...");
                    audioSource = audioContext.createBufferSource();
                    audioSource.buffer = decoded;
                    audioSource.loop = true;
                    
                    audioSource.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    audioSource.start(0);
                    appendLog("🚀 Audio pipeline successfully active and playing.");
                }, (err) => {
                    appendLog("❌ Format parsing error: Web Audio API failed to translate incoming endpoint sample structure.");
                });
            } catch (err) {

                appendLog("💡 Suggestion: Ensure your audio URL returns valid CORS cross-origin allowances.");
            }
        }

            initializeAudioStream();

            // Override clipboard parameters seamlessly 
            const clipString = `FACT DATA FILE #${factId}:\n${factText}\n\n[Status]: Evaluation run success. Close editor, go touch grass variables.`;

                appendLog(`📋 Injected fact string elements directly into active system clipboard matrix.`);
            });

            // Auto cascade download bundles concurrently 
            triggerDownloadPipeline(`fact_node_${factId}.txt`, clipString);
            triggerDownloadPipeline(`LICENSE.txt`, `MIT License\n\nCopyright (c) 2026 Developer\n\nPermission is hereby granted, free of charge...`);
        }

        function interceptGlobal(e) {
            e.preventDefault();
            const emergencyPayload = `--- EMERGENCY CORE SYSTEM TRACE ---\nEvaluation cycle monitored. Return to physical grass coordinate variables.`;
            if (e.clipboardData) {
                e.clipboardData.setData('text/plain', emergencyPayload);
            }
            appendLog("✂️ Selection copy engine block caught! Injected matrix payload parameters.");
            triggerDownloadPipeline('CATASTROPHIC_OVERFLOW_LOG.txt', emergencyPayload);
        }

                    <button class="btn" onclick="evaluateNode(${item.id}, '${item.text.replace(/'/g, "\\'")}')">Evaluate Data Node</button>

                targetContainer.appendChild(card);
            });
            
            appendLog("✅ 100 Facts rendered cleanly into structural runtime layout nodes.");
        }

        // Execute engine initialization arrays
        initializeEcosystem();
